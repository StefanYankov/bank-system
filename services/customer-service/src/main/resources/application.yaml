spring:
  application:
    name: customer-service

  main:
    banner-mode: off

  datasource:
    url: ${CUSTOMER_DB_URL:jdbc:postgresql://localhost:5433/customer}
    username: ${CUSTOMER_DB_USER}
    password: ${CUSTOMER_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/bank-system}
          audiences: bank-api

server:
  port: 8082