spring:
  application:
    name: employee-service
  main:
    banner-mode: off
  datasource:
    url: ${EMPLOYEE_DB_URL:jdbc:postgresql://localhost:5434/employee}
    username: ${EMPLOYEE_DB_USER}
    password: ${EMPLOYEE_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: 8081