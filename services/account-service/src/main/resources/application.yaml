spring:
  application:
    name: account-service
  main:
    banner-mode: off
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:postgresql://localhost:5435/account}
    username: ${ACCOUNT_DB_USER}
    password: ${ACCOUNT_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/bank-system}
          audiences: bank-api
  http:
    serviceclient:
      customer-service:
        base-url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
        connect-timeout: 1000ms
        read-timeout: 2000ms
server:
  port: 8083
resilience4j:
  circuitbreaker:
    instances:
      customer-service:
        sliding-window-type: count-based
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - bg.nbu.banksystem.starter.error.DomainException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
