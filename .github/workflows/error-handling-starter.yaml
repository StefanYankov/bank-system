name: error-handling-starter

on:
  push:
    branches: [ main ]
    paths: &paths
      - 'libs/error-handling-starter/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'gradlew'
      - '.github/workflows/error-handling-starter.yaml'
  pull_request:
    paths: *paths

jobs:
  check:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Test and coverage gate
        run: ./gradlew :libs:error-handling-starter:check

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: error-handling-starter-reports
          path: libs/error-handling-starter/build/reports/