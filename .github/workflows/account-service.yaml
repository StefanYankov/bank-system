name: account-service

on:
  push:
    branches: [main]
    paths: &paths
      - "services/account-service/**"
      - "libs/error-handling-starter/**"
      - "libs/common-identifiers/**"
      - "buildSrc/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "gradlew"
      - ".github/workflows/account-service.yaml"
  pull_request:
    paths: *paths

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and coverage gate
        run: ./gradlew :services:account-service:check
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: account-service-reports
          path: services/account-service/build/reports/
