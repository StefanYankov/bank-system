name: common-identifiers

on:
  push:
    branches: [main]
    paths: &paths
      - "libs/common-identifiers/**"
      - "buildSrc/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "gradlew"
      - ".github/workflows/common-identifiers.yaml"
  pull_request:
    paths: *paths

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Test and coverage gate
        run: ./gradlew :libs:common-identifiers:check

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: common-identifiers-reports
          path: libs/common-identifiers/build/reports/
