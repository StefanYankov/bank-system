[versions]
springBoot = "4.1.1"
springdoc = "3.2.0"
springdocGradlePlugin = "1.9.0"
mapstruct = "1.6.3"
lombokMapstructBinding = "0.2.0"
uuidCreator = "6.1.1"
resilience4j = "2.4.0"
wiremockSpringBoot = "4.4.3"

[libraries]
# --- Web ---
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }

# --- Persistence ---
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }
spring-data-commons = { module = "org.springframework.data:spring-data-commons" }

# --- Security ---
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-security-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-security-oauth2-resource-server" }

# --- Operations ---
spring-boot-starter-opentelemetry = { module = "org.springframework.boot:spring-boot-starter-opentelemetry" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }

# --- Mapping ---
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
lombok = { module = "org.projectlombok:lombok" }
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombokMapstructBinding" }

# --- Identifiers ---
uuid-creator = { module = "com.github.f4b6a3:uuid-creator", version.ref = "uuidCreator" }

# --- Resilience ---
resilience4j-spring-boot4 = { module = "io.github.resilience4j:resilience4j-spring-boot4", version.ref = "resilience4j" }
spring-boot-starter-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient" }
wiremock-spring-boot = { module = "org.wiremock.integrations:wiremock-spring-boot", version.ref = "wiremockSpringBoot" }

# --- Testing ---
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
spring-boot-starter-validation-test = { module = "org.springframework.boot:spring-boot-starter-validation-test" }
spring-boot-starter-flyway-test = { module = "org.springframework.boot:spring-boot-starter-flyway-test" }
spring-boot-starter-actuator-test = { module = "org.springframework.boot:spring-boot-starter-actuator-test" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
spring-boot-starter-security-oauth2-resource-server-test = { module = "org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test" }
spring-boot-starter-restclient-test = { module = "org.springframework.boot:spring-boot-starter-restclient-test" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
assertj-core = { module = "org.assertj:assertj-core" }

# --- Integration testing ---
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }

[plugins]
springdoc-openapi = { id = "org.springdoc.openapi-gradle-plugin", version.ref = "springdocGradlePlugin" }

[bundles]
web = ["spring-boot-starter-webmvc", "spring-boot-starter-validation"]
persistence = ["spring-boot-starter-data-jpa", "spring-boot-starter-flyway", "flyway-database-postgresql"]
security = ["spring-boot-starter-security", "spring-boot-starter-security-oauth2-resource-server"]
testing = [
    "spring-boot-starter-webmvc-test",
    "spring-boot-starter-data-jpa-test",
    "spring-boot-starter-validation-test",
    "spring-boot-starter-flyway-test",
    "spring-boot-starter-actuator-test",
    "spring-boot-starter-security-test",
    "spring-boot-starter-security-oauth2-resource-server-test"
]
integration-testing = ["spring-boot-testcontainers", "testcontainers-junit-jupiter", "testcontainers-postgresql"]
