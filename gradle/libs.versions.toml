[versions]
springBoot = "4.1.1"
springCloud = "2025.1.3"
springdoc = "3.1.1"
springdocGradlePlugin = "1.9.0"
mapstruct = "1.6.3"
lombokMapstructBinding = "0.2.0"

[libraries]
# --- Web ---
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }

# --- Persistence ---
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }

# --- Security ---
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }

# --- Operations ---
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-opentelemetry = { module = "org.springframework.boot:spring-boot-starter-opentelemetry" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

# --- Mapping ---
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
lombok = { module = "org.projectlombok:lombok" }
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombokMapstructBinding" }

# --- Testing ---
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
assertj-core = { module = "org.assertj:assertj-core" }

# --- Integration testing ---
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }

[plugins]
springdoc-openapi = { id = "org.springdoc.openapi-gradle-plugin", version.ref = "springdocGradlePlugin" }

[bundles]
web = ["spring-boot-starter-webmvc", "spring-boot-starter-validation"]
persistence = ["spring-boot-starter-data-jpa", "spring-boot-starter-flyway", "flyway-database-postgresql"]
security = ["spring-boot-starter-security", "spring-boot-starter-oauth2-resource-server"]
testing = ["spring-boot-starter-test", "spring-boot-starter-webmvc-test", "spring-boot-starter-data-jpa-test", "spring-security-test", "assertj-core"]
integration-testing = ["spring-boot-testcontainers", "testcontainers-junit-jupiter", "testcontainers-postgresql"]